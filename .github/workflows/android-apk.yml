name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: npm install

      - name: Build web (static export → out/)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Add / sync Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          DEST="$RUNNER_TEMP/Quietide-debug.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quietide-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (latest APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Quietide Android (debug)
          body: |
            **Debug APK** for personal testing (not for Play Store).

            - Package: `com.quietide.app`
            - Install: download `Quietide-debug.apk`, allow unknown sources if prompted
            - Privacy: https://quietide.vercel.app/privacy/
            - Web / PWA: https://quietide.vercel.app/

            Built from commit `${{ github.sha }}`.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
